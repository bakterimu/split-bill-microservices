spring.application.name=settlement-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/settlement_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.context-path=/api
server.port=8083

client.expense-service.base-url=${EXPENSE_SERVICE_URL:http://localhost:8082/api}
client.expense-service.connect-timeout=2s
client.expense-service.read-timeout=3s

spring.jpa.show-sql=true

springdoc.api-docs.path=/settlement/v3/api-docs
