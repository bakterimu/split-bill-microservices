spring.application.name=expense-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.context-path=/api
server.port=8082

client.user-service.base-url=${USER_SERVICE_URL:http://localhost:8081/api}
client.user-service.connect-timeout=2s
client.user-service.read-timeout=3s

spring.jpa.show-sql=true
